    ball_r_pt: '#c8ccd4'

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: A green, humanoid-shaped particle cloud stands stationary on a brown pedestal. Over time,
      the green particles gradually diffuse and fade in intensity. The white spherical clouds held in
      the hands also become increasingly transparent. By the final frame, the entire figure has nearly
      vanished into the background.
    objects: The primary object is a large, green humanoid figure composed of thousands of small particles.
      It stands atop a solid, rectangular brown pedestal that occupies the bottom center of the frame.
      Two white, spherical clouds of particles are positioned at the ends of the figure's outstretched
      arms. The entire scene is set against a uniform, neutral gray background.
