general:
  name: exp01_morph_armadillo_v7
  seed: 0
  n_frames: 200
  dt: 0.002
  record_cap: 3
  boundary: wall
  dim: 3
  world:
  - 0.35
  - 0.35
  - 0.35
  units:
    length_um: 100.0
  save_data: true
sets:
  mpm_particle:
    n: 100000
    types:
      cyto:
        fraction: 1.0
        youngs: 90.0
        density: 1.0
        block:
        - 0.13999999999999999
        - 0.13999999999999999
        - 0.13999999999999999
        - 0.21
        - 0.21
        - 0.21
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 40
operators:
- op: mpm_strain
  at: mpm_particle
- op: mpm_scatter
  at: mpm_grid
  from: mpm_particle
  drag: 0.5
  a_max: 200.0
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
schedule:
- substep_dt: 0.00034
  compile: true
  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  renderer: vtk_points
  background: '#8d99a6'
  foreground: white
  up_axis: 1
  camera:
    elev: 8
    azim: -90
  zoom: 1.6
  box_frame: false
  render_3d: dots
  dot_size: 1.0
  colors:
    cyto:
    - 0.35
    - 0.55
    - 0.3
  duration_s: 10.0
  slow_motion: 1
