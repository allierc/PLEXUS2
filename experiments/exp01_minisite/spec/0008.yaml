general:
  name: exp01_two_balls_visco_r3
  seed: 0
  n_frames: 1200
  dt: 0.00125
  boundary: wall
  dim: 3
  world:
  - 0.1
  - 0.1
  - 0.1
  save_data: true
  units:
    length_um: 1000000.0
    time_s: 1.0
    force_nN: 1000000000.0
sets:
  cell:
    n: 2
    start:
    - - 0.035
      - 0.065
      - 0.05
    - - 0.065
      - 0.065
      - 0.05
    types:
      viscoelastic:
        fraction: 0.5
        material: viscoelastic
        youngs: 20000.0
        tau: 0.01
        density: 1000.0
        shape: cube
      elastic:
        fraction: 0.5
        material: elastic
        youngs: 20000.0
        density: 1000.0
        shape: cube
  mpm_particle:
    parent: cell
    per_parent: 150000
    radius: 0.5
    density: 1000.0
    particle_mass: 2.7925244444444446e-08
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 192
operators:
- op: gravity
  at: cell
  g: 9.81
- op: mpm_strain
  at: mpm_particle
  implementation: warp
- op: mpm_scatter
  at: mpm_grid
  from: mpm_particle
  drag: 0.0
  a_max: 200.0
  implementation: warp
- op: mpm_grid_update
  at: mpm_grid
  wall_damp: 0.9
  cell_surface_tension: 0.0
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_damp: 0.9
  vmax: 1000000000.0
  implementation: warp
schedule:
- gravity
- substep_dt: 4.310345e-05
  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting:
  renderer: vtk_points
  background: '#8d99a6'
  up_axis: 1
  dot_size: 1.0
  slow_motion: 1
  box_frame: true
  hide_sets:
  - cell
  render_3d: dots
  camera_elev: 1.18
  camera_zoom: 0.0
  camera_turns: 0.0
  colors:
    viscoelastic:
    - 1.0
    - 0.55
    - 0.2
    elastic:
    - 0.93
    - 0.25
    - 0.2
  foreground: white
  surface_opacity: 1.0
  surface_roughness: 0.5
  surface_diffuse: 0.9
  surface_ambient: 0.25
  view_3d: contour
  contour_by_type: true
  duration_s: 10
  ink_per_object: true
  max_frames: 601
  fps: 60
  snap_budget_gb: 4

