descriptions:
  movie:
    description: The simulation shows several distinct clusters of particles moving
      and interacting within a 500 mm cubic domain. Over time, the clusters migrate
      toward the center and bottom of the cube, gradually converging and overlapping
      with one another. The particles exhibit a fluid-like motion, shifting positions
      as they collide and merge into a larger, more complex aggregate. By the final
      frame, the individual clusters have significantly compressed into a dense, multi-colored
      mass near the base of the volume.
    objects: The scene contains approximately eight distinct clusters of particles,
      each characterized by a unique color including pink, blue, yellow, green, purple,
      orange, red, and brown. Each cluster maintains a roughly cubic or rectangular
      shape, though the edges appear fuzzy due to the particle-based representation.
      The clusters are initially separated and distributed throughout the 3D space
      but move toward a common central point. Each individual cluster is relatively
      small, measuring roughly 50 mm to 100 mm in diameter relative to the 500 mm
      cube.

