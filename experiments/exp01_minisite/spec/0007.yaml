# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: Three distinct clusters of particles are initially suspended in the center of a large
      cubic domain. As the simulation progresses, the blue cluster begins to expand rapidly and settle
      onto the bottom surface of the container. The orange cluster remains relatively stationary in the
      center, while the white cluster maintains its position. By the final frame, the blue particles have
      spread out to cover a significant portion of the floor.
    objects: The scene contains three separate clusters of particles, each forming a roughly cubic shape.
      The first cluster is white and remains compact throughout the entire simulation. The second cluster
      is orange and stays positioned in the middle of the domain. The third cluster is blue and starts
      as a cube before flattening into a wide layer on the bottom plane.
