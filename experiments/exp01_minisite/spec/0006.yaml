# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: Three distinct clusters of particles begin in a vertically stacked arrangement near the
      center of a large cubic domain. As the simulation progresses, the clusters begin to descend and
      expand outward toward the bottom surface. The particles eventually spread horizontally across the
      floor of the cube, losing their initial compact shapes. By the final frames, the three groups have
      merged into a single, flattened layer of dispersed particles.
    objects: The scene contains three primary clusters of particles, each represented by a different color.
      The top cluster is teal, the middle cluster is yellow, and the bottom cluster is red. Each cluster
      is initially a compact, roughly cubic shape approximately 50 mm in size. As time passes, the clusters
      expand and transition from discrete units into a continuous, interconnected field of points.
