general:
  name: exp05_spheroid_v01_f1000
  seed: 1
  n_frames: 1000
  dt: 1.0
  record_cap: 1001
  boundary: free
  dim: 3
  world: [30.0, 30.0, 30.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 20
    buffer: 1000
    types:
      cell: {fraction: 1.0}
    state:
      pos: {width: 3, role: coordinate, integration: first_order, boundary: world}
      size: {width: 1}
      contacts: {width: 1}
      founder: {width: 1}
fields: {}
seed:
- {op: seed_positions, at: cell, mode: ball, radius: 10.0, seed: 1}
operators:
- {op: thermal_bath, at: cell, kT: 0.045, mobility: 1.0, seed: 1}
- {op: pair_potential, model: soft_adhesive, at: cell, sigma: 1.0, epsilon: 1.0, adhesion: 0.3, tail: 0.2, mobility: 1.0}
- {op: cell_divide, implementation: point_adhesion, at: cell, rate: 0.00578, touch: 1.1, min_contacts: 1, offset: 0.5, size_cv: 0.1, seed: 1}
schedule:
- steps: [thermal_bath, pair_potential]
  substep_dt: 0.1
- cell_divide
plotting:
  renderer: vtk_points
  subject: cell
  dot_radius: {cell: 0.5}
  glyphs_only: true
  colors: {cell: '#c8805a'}
  background: '#8d99a6'
  foreground: white
  box_frame: false
  camera: {elev: 25, azim: 30}
  zoom: 1.4
  duration_s: 10
  slow_motion: 1
  real_time: false
  curve_time: {per_frame_s: 600.0, unit: h}
  curve:
  - {quantity: 'count:cell', ylabel: cells, xlabel: time (h), ymin: 0}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation shows a collection of spherical particles moving through a three-dimensional
      space. Over time, the particles exhibit stochastic motion, drifting and changing their relative
      positions. The distribution of the particles remains relatively sparse throughout the sequence.
      There is no evidence of significant clustering or interaction between the individual nodes.
    objects: The scene contains approximately 20 spherical nodes distributed within a 300 $\mu$m cube.
      Each node is rendered in a uniform reddish-brown or copper color. The particles are small and appear
      to be of a consistent diameter across the simulation. They are arranged in a non-ordered, scattered
      topology with no physical connections between them.
