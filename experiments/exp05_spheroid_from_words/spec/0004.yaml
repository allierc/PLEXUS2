general:
  name: exp05_spheroid_v04_f1000
  seed: 1
  n_frames: 21600
  dt: 0.02
  record_cap: 1001
  boundary: free
  dim: 3
  world: [30.0, 30.0, 30.0]
  units: {length_um: 10.0, time_s: 600.0}
sets:
  cell:
    n: 20
    buffer: 1000
    types:
      slate: {fraction: 0.125}
      sage: {fraction: 0.125}
      sand: {fraction: 0.125}
      terracotta: {fraction: 0.125}
      rose: {fraction: 0.125}
      ochre: {fraction: 0.125}
      plum: {fraction: 0.125}
      teal: {fraction: 0.125}
    state:
      pos: {width: 3, role: coordinate, integration: first_order, boundary: world}
      size: {width: 1}
      contacts: {width: 1}
      founder: {width: 1}
fields: {}
seed:
- {op: seed_positions, at: cell, mode: ball, radius: 10.0, seed: 1}
operators:
- {op: thermal_bath, at: cell, kT: 0.045, mobility: 1.0, seed: 1}
- {op: pair_potential, model: soft_adhesive, at: cell, sigma: 1.0, epsilon: 1.0, adhesion: 0.3, tail: 0.2, mobility: 1.0}
- {op: cell_divide, implementation: point_adhesion, at: cell, rate: 0.00578, touch: 1.1, min_contacts: 1, offset: 0.5, size_cv: 0.1, seed: 1}
schedule: [thermal_bath, pair_potential, cell_divide]
plotting:
  renderer: vtk_points
  subject: cell
  dot_radius: {slate: 0.5, sage: 0.5, sand: 0.5, terracotta: 0.5, rose: 0.5, ochre: 0.5, plum: 0.5, teal: 0.5}
  glyphs_only: true
  colors: {slate: '#6b7f99', sage: '#8fa98a', sand: '#d8c39a', terracotta: '#c8805a', rose: '#c99a9e', ochre: '#c9a14a', plum: '#8e6f8e', teal: '#5f9a96'}
  background: '#8d99a6'
  foreground: white
  box_frame: false
  camera: {elev: 25, azim: 30}
  zoom: 2.2
  duration_s: 10
  slow_motion: 1
  real_time: false
  curve_time: {per_frame_s: 0.0033333, unit: s}
  curve:
  - {quantity: 'count:cell', ylabel: cells, xlabel: time (h), ymin: 0}

# --- auto: video descriptions (gemma-4-12B) ---
descriptions:
  movie:
    description: The simulation shows a collection of spherical particles that gradually aggregate into
      distinct clusters over time. Initially, the particles are scattered across the space, but they begin
      to move toward one another as the frames progress. By the final frames, several large, dense clusters
      have formed while a few isolated particles remain on the periphery. The accompanying graph in the
      top right corner tracks the increasing number of "cells" or connected components as the particles
      group together.
    objects: The scene contains numerous small, spherical particles of varying colors including shades
      of blue, green, orange, and pink. These particles are initially distributed randomly but eventually
      form tight, overlapping clusters of varying sizes. Each individual sphere appears to be roughly
      the same size, though the clusters they form create larger, complex shapes. A white scale bar at
      the bottom indicates a physical dimension of 25 μm for the simulated environment.
