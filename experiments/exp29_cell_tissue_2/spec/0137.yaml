general:
  name: mpm_sphere_twin_4000_three_stage_skin
  headline: a sphere of red cells round one blue cell that grows and divides, held by the three adhesion stages, with a three-layer skin on every contact face
  title: 'One blue inner cell at the centre of a closed sphere of 20 red cells (one cell thick), every cell 4000 points; only the blue cell grows (mass doubles every 80 frames = 80 min) and divides at twice its birth mass (division mass spread 0.3); the cells are held by the three adhesion stages of exp38''s vesicle: the contact surface tension -0.1177 (pair_potential[cell_contact]), the force curve of the dense two-cell rig with its gaps x2 and its accelerations x0.5 (attraction_repulsion[force_curve_local_gap_all_bodies]) and the junction trio at bond stiffness 0.0304; on every face where two cells touch at the first frame, and on both faces of every division, a skin of 3 dense layers (cell_divide[cleave_tangent_skin]: pitch 0.0517 = 517 nm, trim 0.15, front layers 0.0053 apart = 53 nm), the loop''s best skin of exp38'
  seed: 1
  n_frames: 350
  dt: 1.0
  record_cap: 121
  boundary: free
  dim: 3
  world:
  - 20.0
  - 20.0
  - 20.0
  units:
    length_um: 10.0
    time_s: 60.0
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 15
    per_parent: cell
    cell_box: 3.0
sets:
  cell:
    n: 21
    type_layout: ordered
    types:
      inner:
        count: 1
        shape: ball
        material: viscoelastic
        youngs: 20.0
        tau: 2.0
        density: 1.0
      outer:
        count: 20
        shape: ball
        material: viscoelastic
        youngs: 20.0
        tau: 2.0
        density: 1.0
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
      pol:
        width: 3
      adh:
        width: 6
      arr:
        width: 1
      ij:
        width: 2
      tone:
        width: 1
      lab:
        width: 1
      mass:
        width: 1
      mass0:
        width: 1
      born:
        width: 1
      div_ready:
        width: 1
      grow:
        width: 1
    buffer: 64
  pt:
    entity: mpm_particle
    parent: cell
    per_parent: 4000
    grow_reserve: 14400
    density: 1.0
    radius: 0.5
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
      pid:
        width: 1
      cellc:
        width: 1
      face:
        width: 1
      skin:
        width: 1
  junction:
    n: 0
    buffer: 65536
    state:
      ca:
        width: 1
        integration: none
      cb:
        width: 1
        integration: none
      fg:
        width: 1
        integration: none
      rho:
        width: 1
        integration: first_order
      area:
        width: 1
        integration: none
      load:
        width: 1
        integration: none
operators:
- op: contact_finder
  at: junction
  points: pt
  cells: cell
  spacing: 0.2
  bond_range: 0.38
  implementation: hashgrid
- op: bond_binding
  at: junction
  cells: cell
  implementation: immediate
  binding_rate: 1.0
  unbinding_rate: 0.01
  bond_strength: 1.0
  bell: bond
  min_area: 0.1
  type_matrix:
  - - 1.0
    - 1.0
  - - 1.0
    - 1.0
- op: pair_potential
  model: cell_contact
  at: pt
  cells: cell
  repulsion_strength: 600.0
  contact_slack: 0.3
  contact_surface_tension:
  - - -0.1176628
    - -0.1176628
  - - -0.1176628
    - -0.1176628
  contact_edge_width: 0.2
- op: bond_springs
  at: pt
  junctions: junction
  bond_stiffness: 0.030383
  bond_damping: 0.05
  spacing: 0.2
  bond_rest_length: 0.19
  bond_range: 0.38
- op: mpm_strain
  at: pt
  implementation: polar
- op: mpm_scatter
  at: mpm_grid
  from: pt
  drag: 1.0
  implementation: warp_pp
- op: mpm_grid_update
  at: mpm_grid
  implementation: warp_pp_balanced
  cell_surface_tension: 0.082173
  csf_rho: 1.0
  csf_band: 0.1
  csf_smooth: 1
  tension_on: all
- op: mpm_gather
  at: pt
  from: mpm_grid
  implementation: warp_pp
- op: aggregate_centroid
  at: cell
  child: pt
- op: cell_cycle
  model: mpm
  at: cell
  rule: doubler_mass
  factor: 2.0
  factor_cv: 0.3
  mark: div_ready
  born: born
  seed: 1
- op: cell_grow
  model: mpm
  at: cell
  points: pt
  rate: 0.0
  rate_block: grow
  dims: 3.0
  rho: 1.0
  after_frame: 0
- op: cell_populate
  model: mpm
  at: cell
  points: pt
  seat: fill
  jitter: 0.3
  swell: true
  seed: 1
- op: cell_divide
  model: cleave_tangent_skin
  at: cell
  points: pt
  yolk_weight: 0.0
  p_div: 1.0
  max_per_call: 4
  mark: div_ready
  daughter_mark: born
  seed: 1
  centre:
  - 10.0
  - 10.0
  - 10.0
  layers: 3
  pitch: 0.0517
  face_gap: 0.0053333
  trim: 0.15
  face_points: 8
  skin_block: skin
  seed_skin: true
  seed_reach: 0.3
  seed_min_pairs: 3
- op: attraction_repulsion
  implementation: force_curve_local_gap_all_bodies
  at: pt
  knots:
  - 0.0
  - 0.004
  - 0.008
  - 0.012
  - 0.02
  - 0.04
  - 0.1
  - 0.16
  curve:
  - -48.6
  - -23.95
  - -1.0
  - -1.3
  - -1.85
  - -0.3
  - 0.4
  - 2.9
schedule:
- contact_finder
- bond_binding
- steps:
  - pair_potential
  - attraction_repulsion
  - bond_springs
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
  substep_dt: 0.01
  capture: false
- aggregate_centroid
- cell_cycle
- cell_grow
- cell_populate
- cell_divide
seed:
- op: seed_positions
  model: vesicle
  at: pt
  cell_set: cell
  centre: &id001
  - 10.0
  - 10.0
  - 10.0
  spacing: 1.05
  inner_extent: 0.5
  outer_extent: 0.5
  point_spacing: 0.0394
  live_per_cell: 4000
  adh: 1.0
  seed: 1
  vesicles:
  - centre: *id001
    core: true
    core_radius: 0.62
    polar: false
    values:
      grow: 0.0028881132523331052
  - centre: *id001
    polar: false
plotting:
  renderer: vtk_points
  subject: pt
  cell_colours: type
  colors:
    inner: '#3b6fd4'
    outer: '#e63946'
  type_opacity:
    inner: 0.1
  junction_panel: true
  render_3d: contour
  contour_bodies:
    mode: partition
    iso: 0.55
    sigma: 2.0
    reach: 0.25
    smooth_method: taubin
    smooth: 40
    pass_band: 0.02
    coat: 0.0
    color_by:
      block: cellc
      channel: 0
      cmap: YlOrBr
      range:
      - 0.0
      - 19.0
      floor: 0.15
  surface_opacity: 1.0
  surface_roughness: 0.5
  surface_diffuse: 0.9
  surface_ambient: 0.25
  background: '#8d99a6'
  foreground: white
  box_frame: false
  camera:
    elev: 55
    azim: -60
  zoom: 1.0
  duration_s: 10
  slow_motion: 1
  surface_iso_frac: 0.3
  point_volume: 0.00025
