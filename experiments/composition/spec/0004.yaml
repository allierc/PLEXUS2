general:
  name: composition_folds
  seed: 0
  n_frames: 1800
  dt: 1.0
  record_cap: 1802
  record_every: 1
  boundary: free
  dim: 3
  world:
  - 80.0
  - 80.0
  - 80.0
_run:
  target_cells: 50000
  seed_cells: 2000
sets:
  vertex:
    n: 130004
    mesh: half_edge
  cell:
    n: 65004
    state:
      chem:
        width: 2
        integration: first_order
      cen:
        width: 3
      area:
        width: 1
      Vbirth:
        width: 1
        record: false
      divjit:
        width: 1
        record: false
      centroid:
        width: 3
      A0:
        width: 1
      P0:
        width: 1
      V0f:
        width: 1
      alive:
        width: 1
        record: false
      age:
        width: 1
      ndiv:
        width: 1
      mg_scale:
        width: 1
        record: false
      A0_init:
        width: 1
        record: false
      P0_init:
        width: 1
        record: false
      V0f_init:
        width: 1
        record: false
      inhib_frac:
        width: 1
      elong:
        width: 1
        record: false
      apop_flag:
        width: 1
  half_edge:
    n: 520032
    maps:
      srce: vertex
      trgt: vertex
      face: cell
fields: {}
operators:
- op: seed_mesh
  at: vertex
  cell_set: cell
  before_frame: 1
  n_cells: 2000
  radius: 5.0
  jitter: 0.15
  seed: 0
  vseed_cv: 0.15
  p0: 3.5
- op: cell_geometry
  at: cell
- op: seed_cell_chem
  at: cell
  n_spots: 1
  cone_deg: 8.0
  seed: 0
  before_frame: 3
  seed_frac: 0.06
- op: cell_neighbours
  at: cell
- op: cell_chem_diffuse
  at: cell
  implementation: graph_laplacian
  d_a: 0.08
  d_h: 0.16
  chi: 1.3
- op: cell_chem_react
  at: cell
  model: gray_scott
  rate: 0.75
  F: 0.046
  kk: 0.031
- op: cell_chem_from_shape
  at: cell
  model: curvature
  vertex_set: vertex
  beta: 0.5
  F0: 0.046
  rate: 1.0
- op: cell_grow
  at: vertex
  cell_set: cell
  rate: 0.000866
  a_sw: 0.35
  hill: 4.0
  rho: 0.1
  vth_frac: 2.5
  after_frame: 100
  conserve_amount: false
- op: cell_mechanics
  at: vertex
  p0: 3.5
  K_A: 1.0
  K_P: 1.0
  Gamma: 0.4
  Lambda: 0.5
  K_V: 80.0
  K_R: 0.0
  K_bend: 0.02
  K_lumen: 0.5
  antiinv: 0.0
  mu: 1.0
  dt: 1.0
  relax_iters: 30
  eta: 0.08
  cap_frac: 0.12
- op: edge_flip
  at: vertex
  l_th_frac: 0.28
  every: 1
  max_flips: 300
- op: cell_divide
  at: vertex
  factor: 2.0
  reset_noise: 0.12
  cycle_cv: 0.15
  p0: 3.5
  every: 4
  cell_set: cell
  min_cycle: 4
  max_cycle: 1000000000
  after_frame: 100
  orient_iface: false
  orient_asw: 0.6
  g1_ramp: false
  engine_clock: true
- op: topo_record
  at: vertex
  every: 1
schedule:
- seed_mesh
- cell_geometry
- seed_cell_chem
- cell_neighbours
- cell_chem_diffuse
- cell_chem_react
- cell_chem_from_shape
- cell_grow
- cell_mechanics
- edge_flip
- cell_divide
- topo_record
