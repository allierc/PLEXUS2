general:
  name: exp09_land_it06
  headline: 'exp09 it06: a crowded molecular landscape of 404 MPM bodies (25 % of a slab 192 x 108 x 52 nm)'
  title: 'iteration 6, from it02 ONE change: the proteins through the membrane are 5x stiffer (Young''s modulus 100, every other body 20): in it02 the sheet held for 1,000 frames and nothing crossed it, but the contact tension -0.2 that holds the proteins in the sheet smeared them along it (their radius of gyration grew to 1.28-1.47 of its start); a strain set by tension over stiffness should fall about 5x, so the proteins stand through the sheet as seeded'
  seed: 1
  n_frames: 1000
  dt: 1.0
  record_cap: 251
  save_every_min: 10.0
  boundary: free
  dim: 3
  world:
  - 20.4
  - 12.0
  - 6.4
  units:
    length_um: 0.01
    time_s: 2.0e-07
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 15
    per_parent: cell
    cell_box: 3.0
sets:
  cell:
    n: 404
    type_layout: ordered
    types:
      ribosome:
        count: 18
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      chaperonin:
        count: 26
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      rod:
        count: 26
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      trimer:
        count: 26
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      enzyme:
        count: 57
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      small:
        count: 110
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      lipid:
        count: 85
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      channel:
        count: 10
        shape: ball
        material: elastic
        youngs: 100.0
        density: 1.0
      antibody:
        count: 16
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      serum:
        count: 30
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
  pt:
    entity: mpm_particle
    parent: cell
    per_parent: 343
    density: 1.0
    radius: 0.5
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
      pid:
        width: 1
      cellc:
        width: 1
        record: false
operators:
- op: thermal_bath
  implementation: langevin
  at: pt
  friction: 0.05
  kT: 0.0001
  substep_dt: 0.01
  seed: 1
- op: active_force
  model: box_slab
  at: pt
  wall_stiffness: 400.0
  lo:
  - 0.6
  - 0.6
  - 0.6
  hi:
  - 19.8
  - 11.4
  - 5.8
- op: pair_potential
  model: cell_contact
  at: pt
  cells: cell
  repulsion_strength: 600.0
  contact_slack: 0.2
  contact_surface_tension:
