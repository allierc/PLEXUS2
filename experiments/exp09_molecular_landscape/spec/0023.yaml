general:
  name: exp09_land_a100k
  headline: 'exp09 a100k: a crowded molecular landscape of 100,000 MPM bodies (19 % of a slab 3,115 x 1,752 x 52 nm)'
  title: 'TWIN A of step 21 at 100,000 molecules: it33''s scene (the valence rule -- dimers 2 bonds, three-lobed complexes 3, tetramers 4, each kind binding its own; the walking motors; the passive crowd) with every count x 263 and the slab widened 16.2 x in x and y to 3.1 x 1.75 um, its depth (52 nm) and its share of the volume (19 %) kept, every body as in step 21; 1,000 frames (200 us) on one H200. At left the whole slab, every body a dot at its centre; at right a 192 x 108 nm window from its centre, the size of step 21''s whole slab, every body drawn by its points. Do the chains, trees and networks of step 21 form alike when the crowd is 263 times larger'
  seed: 1
  n_frames: 4000
  dt: 1.0
  record_cap: 1001
  save_chunk_window:
    set: pt
    box:
    - - 137.13256428553206
      - 77.39956741061177
    - - 175.53256428553203
      - 98.99956741061176
    margin: 1.5
    edges:
      set: junction
      a: ca
      b: cb
      keep:
      - rho
  save_chunk_frames: 250
  boundary: free
  dim: 3
  world:
  - 312.66512857106403
  - 176.39913482122353
  - 6.4
  units:
    length_um: 0.01
    time_s: 2.0e-07
