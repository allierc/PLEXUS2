general:
  name: exp10_oo_oo1
  headline: 'exp10 oo1: a crowded molecular landscape of 11,672 MPM bodies (11 % of a slab 255 x 144 x 144 nm)'
  title: 'THE TWIN OF exp09''s STEP 26 WITH THE REAL CAST (Cedric, 2026-11-19: "a twin of exp09-26 with the new cast only the 3D panel + the matrices"): a periodic box 255 x 144 x 144 nm, no walls, holding 32 strands of each of 6 mRNAs (oskar, nanos, pgc, germ cell-less, Cyclin B, Hsp83: chains of 14 to 57 subunits of 3 nm, one per 50 nucleotides) and 300 of each of 10 proteins (Short Oskar, Vasa, Tudor, Aubergine, Bruno, Staufen, Hrp48, Cup, Glorund, Smaug), each protein ONE elastic body shaped from its AlphaFold model at 1 nm per point (a lobe per folded domain and per disordered stretch). The 31 pairs of the cast bind by their standard binding free energies (5 measured, 1 from homologs, 25 assumed), a strand never with itself (NEW operator variant bond_binding[delta_g_molecule]); the substep block runs the Warp variants of exp09''s speed work as one captured graph. Do the two granule types appear: the germ granule''s proteins (Oskar, Vasa, Tudor, Aubergine) gathering nanos, pgc, germ
    cell-less and Cyclin B, and oskar apart with Bruno, Staufen and Hrp48'
