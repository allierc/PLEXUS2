general:
  name: exp09_land_it12
  headline: 'exp09 it12: a crowded molecular landscape of 793 MPM bodies (25 % of a slab 192 x 108 x 90 nm)'
  title: 'iteration 12, it10''s scene with its chains held by BONDS instead of a contact tension: at the first substep every pair of points of two different chain subunits seeded within 2.4 nm of each other -- the facing points of two consecutive subunits of a filament or a thread, and nothing else -- is tied by a spring at its then length, as stiff as the material itself (apical_junction, k 4); the tension between a chain''s own subunits is gone (0), and the heads and the ribosomes bind at -0.03 instead of -0.05. In it10 the chains held by a tension of -0.05 were whole at frame 100 and then degraded (thread elements pulled into pieces, filament subunits to 1.7 of their radius of gyration, heads to 1.33): do bonded chains stay whole and keep their subunits'' shape for 1,000 frames'
  seed: 1
  n_frames: 1000
  dt: 1.0
  record_cap: 251
  save_every_min: 10.0
  boundary: free
  dim: 3
  world:
  - 20.4
  - 12.0
  - 10.2
  units:
    length_um: 0.01
    time_s: 2.0e-07
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 15
    per_parent: cell
    cell_box: 3.0
sets:
  cell:
    n: 793
    type_layout: ordered
    types:
      ribosome:
        count: 30
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      small:
        count: 150
