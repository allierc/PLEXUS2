      dimer:
        count: 68
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      pear:
        count: 78
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      bean:
        count: 40
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      ring:
        count: 30
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
      bonded:
        width: 1
        record: false
  pt:
    entity: mpm_particle
    parent: cell
    per_parent: 343
    density: 1.0
    radius: 0.5
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
      pid:
        width: 1
      cellc:
        width: 1
        record: false
