  contact_edge_width: 0.2
- op: apical_junction
  at: pt
  cells: cell
  k: 4.0
  reach: 0.24
  shell: 1000000000.0
  skip_block: bonded
- op: mpm_strain
  at: pt
  implementation: default
- op: mpm_scatter
  at: mpm_grid
  from: pt
  drag: 0.0
  implementation: default
- op: mpm_grid_update
  at: mpm_grid
  implementation: warp_pp_balanced
- op: mpm_gather
  at: pt
  from: mpm_grid
  implementation: default
- op: aggregate_centroid
  at: cell
  child: pt
schedule:
- steps:
  - thermal_bath
  - active_force
  - pair_potential
  - apical_junction
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
  substep_dt: 0.01
  capture: false
- aggregate_centroid
