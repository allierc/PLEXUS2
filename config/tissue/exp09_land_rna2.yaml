general:
  name: exp09_land_rna2
  headline: 'exp09 rna2: a crowded molecular landscape of 480 MPM bodies (14 % of a slab 192 x 108 x 52 nm)'
  title: 'THE mRNA SCENE WITH BINDING FREE ENERGIES (NEW operator variant bond_binding[delta_g]): step 24''s strands, proteins, sites and valences, each pair of kinds given a Delta G of a pair in contact, -2 kT (the weakest affinity, 0.4) to -8 kT (the strongest, 1); a junction''s unbinding rate is its binding rate x exp(Delta G / kT), and each junction is one bond, bound or not, drawn every frame. Do the weak pairs flicker and the strong ones stay, and does the occupancy of each mRNA kind follow its partners'' free energies'
