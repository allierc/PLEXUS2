general:
  name: exp09_land_it11
  headline: 'exp09 it11: a crowded molecular landscape of 589 MPM bodies (23 % of a slab 192 x 108 x 90 nm)'
  title: 'iteration 11, a cell surface (it08''s 90 nm deep slab and calm bath): NEW GEOMETRIES -- a membrane 62 nm above the floor whose proteins are of two kinds in turn, one site in six: a receptor (a 14 nm head above the sheet on a neck through it) and the plain channel; inside, a dense crowd of four-lobed tetramers with a few ribosomes, curved rods and globules; outside, Y-shaped bodies, dimers and globules; NEW INTERACTION -- the Y-shaped bodies dock on the receptors'' heads (contact tension -0.03; the sheet''s own patch-to-patch tension stays -0.2, patch-to-protein -0.05): do the Y bodies collect on the heads over 1,000 frames, do the receptors stay upright in the sheet, and does anything cross it'
  seed: 1
  n_frames: 1000
  dt: 1.0
  record_cap: 251
  save_every_min: 10.0
  boundary: free
  dim: 3
  world:
  - 20.4
  - 12.0
  - 10.2
  units:
    length_um: 0.01
    time_s: 2.0e-07
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 15
    per_parent: cell
    cell_box: 3.0
sets:
  cell:
    n: 589
    type_layout: ordered
    types:
      ribosome:
        count: 16
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      small:
        count: 130
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      lipid:
        count: 140
        shape: ball
        material: elastic
        youngs: 20.0
