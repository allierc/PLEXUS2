      channel:
        count: 15
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      antibody:
        count: 45
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      serum:
        count: 40
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      clover:
        count: 123
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      dimer:
        count: 30
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      bean:
        count: 34
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      receptor:
        count: 16
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
  pt:
    entity: mpm_particle
    parent: cell
    per_parent: 343
    density: 1.0
    radius: 0.5
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
      pid:
        width: 1
      cellc:
        width: 1
        record: false
