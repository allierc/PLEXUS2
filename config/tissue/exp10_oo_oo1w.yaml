general:
  name: exp10_oo_oo1w
  headline: 'exp10 oo1w: a crowded molecular landscape of 11,672 MPM bodies (11 % of a slab 255 x 144 x 144 nm)'
  title: 'THE FIRST exp10 SCENE WITH WALLS: oo1''s cast, counts, shapes and binding free energies (32 strands of each of 6 mRNAs, 300 of each of 10 proteins, 11,672 bodies) in the same box 255 x 144 x 144 nm, held by soft walls instead of joined face to face. With walls every operator of a frame runs on the GPU, the contact search included, as validated on exp09''s step 25. Do the same bonds form as in the periodic box, and how much faster does the frame go'
