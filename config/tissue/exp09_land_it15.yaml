general:
  name: exp09_land_it15
  headline: 'exp09 it15: a crowded molecular landscape of 840 MPM bodies (28 % of a slab 192 x 108 x 90 nm)'
  title: 'iteration 15, two cells meeting: TWO membranes held by springs, 30 nm apart, the lower one carrying receptors with their heads up, the upper one their partners with their heads down, site against site, so that every receptor''s head starts 2.6 nm from its partner''s (no spring between them) and the two stick (contact tension -0.03); below the lower membrane one cell''s crowd (tetramers, ribosomes, curved rods, globules, 2 threads), above the upper one another''s (dimers, rings, heads, 3 filaments), globules in the cleft: do the pairs of heads hold the two membranes together across the cleft for 1,000 frames, and does each crowd stay on its side'
  seed: 1
  n_frames: 1000
  dt: 1.0
  record_cap: 251
  save_every_min: 10.0
  boundary: free
  dim: 3
  world:
  - 20.4
  - 12.0
  - 10.2
  units:
    length_um: 0.01
    time_s: 2.0e-07
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 15
    per_parent: cell
    cell_box: 3.0
