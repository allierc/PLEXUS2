general:
  name: exp09_land_it10
  headline: 'exp09 it10: a crowded molecular landscape of 792 MPM bodies (25 % of a slab 192 x 108 x 90 nm)'
  title: 'iteration 10, the cytoplasm recast after the reference pictures (it08''s 90 nm deep slab and calm bath): NEW GEOMETRIES -- 8 straight filaments of 20 subunits (8 nm blocks in a row, 160 nm long), 5 meandering threads of 30 elements (6 nm blocks), four-lobed tetramers, two-lobed dimers, pear-shaped heads, curved rods, rings with a hole, Y-shaped bodies, with the two-lobed ribosomes and the 6 nm globules kept; NEW INTERACTIONS -- a filament and a thread are held together by the contact tension between their own subunits alone, the pear-shaped heads stick to the filaments and the ribosomes to the threads, every one of these four tensions -0.05 (the value that held it07''s membrane proteins without smearing them; at -0.2 the smoke''s filament subunits spread over each other, 26 of 160 past 1.10 of their radius of gyration in 60 frames): do the chains hold for 1,000 frames, do the heads decorate the filaments and the ribosomes line the threads'
  seed: 1
  n_frames: 1000
  dt: 1.0
  record_cap: 251
  save_every_min: 10.0
  boundary: free
  dim: 3
  world:
  - 20.4
  - 12.0
  - 10.2
  units:
    length_um: 0.01
    time_s: 2.0e-07
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 15
    per_parent: cell
    cell_box: 3.0
sets:
  cell:
    n: 792
    type_layout: ordered
    types:
      ribosome:
        count: 30
        shape: ball
        material: elastic
        youngs: 20.0
