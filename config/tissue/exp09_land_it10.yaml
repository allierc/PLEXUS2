- op: mpm_scatter
  at: mpm_grid
  from: pt
  drag: 0.0
  implementation: default
- op: mpm_grid_update
  at: mpm_grid
  implementation: warp_pp_balanced
- op: mpm_gather
  at: pt
  from: mpm_grid
