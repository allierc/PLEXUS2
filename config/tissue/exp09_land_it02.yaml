- op: thermal_bath
  implementation: langevin
  at: pt
  friction: 0.05
  kT: 0.0001
  substep_dt: 0.01
  seed: 1
- op: active_force
  model: box_slab
  at: pt
  wall_stiffness: 400.0
  lo:
  - 0.6
  - 0.6
  - 0.6
  hi:
  - 19.8
  - 11.4
  - 5.8
- op: pair_potential
