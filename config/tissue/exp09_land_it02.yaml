general:
  name: exp09_land_it02
  headline: 'exp09 it02: a crowded molecular landscape of 404 MPM bodies (25 % of a slab 192 x 108 x 52 nm)'
  title: 'iteration 2, from it01 ONE change: a membrane across the slab, two thirds of the way up -- a sheet of 95 sites, 10 x 6 x 10 nm patches of 75 points with one site in nine a protein standing through it (125 points, 9 x 22 nm), the patches sticking to each other and to the proteins (contact tension -0.2) -- with it01''s crowd at the same 26 % below it and a sparse outside above it (16 Y-shaped bodies and 30 globules, 10 %): does a sheet of sticky MPM patches hold as a membrane for 1,000 frames between a crowded and a sparse side'
  seed: 1
  n_frames: 1000
  dt: 1.0
  record_cap: 251
  save_every_min: 10.0
  boundary: free
  dim: 3
  world:
  - 20.4
  - 12.0
  - 6.4
  units:
    length_um: 0.01
    time_s: 2.0e-07
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 15
    per_parent: cell
    cell_box: 3.0
sets:
  cell:
    n: 404
    type_layout: ordered
    types:
      ribosome:
        count: 18
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      chaperonin:
        count: 26
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      rod:
        count: 26
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      trimer:
        count: 26
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      enzyme:
        count: 57
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      small:
        count: 110
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      lipid:
        count: 85
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      channel:
        count: 10
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      antibody:
        count: 16
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      serum:
        count: 30
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
  pt:
    entity: mpm_particle
    parent: cell
    per_parent: 343
    density: 1.0
    radius: 0.5
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
      pid:
        width: 1
      cellc:
        width: 1
        record: false
