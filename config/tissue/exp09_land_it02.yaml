- op: mpm_strain
  at: pt
  implementation: default
- op: mpm_scatter
  at: mpm_grid
  from: pt
  drag: 0.0
  implementation: default
- op: mpm_grid_update
  at: mpm_grid
  implementation: warp_pp_balanced
- op: mpm_gather
  at: pt
  from: mpm_grid
  implementation: default
- op: aggregate_centroid
  at: cell
  child: pt
schedule:
- steps:
  - thermal_bath
  - active_force
  - pair_potential
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
  substep_dt: 0.01
  capture: false
- aggregate_centroid
seed:
- op: seed_positions
  model: from_points_ragged
  at: pt
  cell_set: cell
  points: experiments/exp09_molecular_landscape/data/seed_it02.npz
  um_per_unit: 0.01
  centre_um:
  - 0.0
  - 0.0
  - 0.0
  centre:
  - 0.0
  - 0.0
  - 0.0
plotting:
  renderer: vtk_points
  subject: pt
  render_3d: contour
  point_volume: 0.008000000000000002
  cell_colours: type
  colors:
    ribosome: '#9B5DE5'
    chaperonin: '#4D96FF'
    rod: '#F15BB5'
    trimer: '#E9C46A'
    enzyme: '#2A9D8F'
    small: '#8AC926'
    lipid: '#F4A261'
    channel: '#E63946'
    antibody: '#00BBF9'
    serum: '#43AA8B'
  surface_opacity: 1.0
  background: '#8d99a6'
  foreground: white
  box_frame: false
  camera:
    elev: 90
    azim: -90
  zoom: 1.0
  duration_s: 10
  slow_motion: 1
