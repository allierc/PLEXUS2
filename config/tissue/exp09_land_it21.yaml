general:
  name: exp09_land_it21
  headline: 'exp09 it21: a crowded molecular landscape of 370 MPM bodies (18 % of a slab 192 x 108 x 52 nm)'
  title: 'iteration 21 -- ADDED: A SIGNAL PASSED AT CONTACTS (cell_neighbours, cell_chem_react[aliev_panfilov], cell_chem_diffuse[contact_weighted]), on it20''s scene with its motors and bonds. Every body carries an excitation: above a threshold it fires, stays up on the order of 100 frames, falls and cannot fire again for a while. The bodies within 15 nm of the left wall are made to fire at frames 40, 290, 540 and 790. A body that fires excites the bodies it touches, in proportion to their contact. The movie shows the excitation as a pale yellow fill. Does each firing cross the slab from left to right as a front, from body to touching body, and how fast, in a crowd where contacts are made and lost'
  seed: 1
  n_frames: 1000
  dt: 1.0
  record_cap: 251
  save_every_min: 10.0
  boundary: free
  dim: 3
  world:
  - 20.4
  - 12.0
  - 6.4
  units:
    length_um: 0.01
    time_s: 2.0e-07
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 15
    per_parent: cell
    cell_box: 3.0
sets:
  cell:
    n: 370
    type_layout: ordered
    types:
      enzyme:
        count: 60
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      small:
        count: 120
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      clover:
        count: 40
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      dimer:
        count: 60
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      pear:
        count: 40
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      bean:
        count: 30
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
      ring:
        count: 20
        shape: ball
        material: elastic
        youngs: 20.0
        density: 1.0
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
      adh:
        width: 6
        record: false
      chem:
        width: 2
        integration: first_order
  pt:
    entity: mpm_particle
    parent: cell
    per_parent: 343
    density: 1.0
    radius: 0.5
    state:
      pos:
        width: 3
        role: coordinate
        integration: coordinate
        boundary: world
      vel:
        width: 3
        role: rate
        integration: rate
        record: false
      pid:
        width: 1
      cellc:
        width: 1
        record: false
      face:
        width: 1
        record: false
  junction:
    n: 0
    buffer: 16384
    state:
      ca:
        width: 1
        integration: none
      cb:
        width: 1
        integration: none
      fg:
        width: 1
        integration: none
        record: false
      rho:
        width: 1
        integration: first_order
      area:
        width: 1
        integration: none
      load:
        width: 1
        integration: none
operators:
- op: thermal_bath
  implementation: langevin
  at: pt
  friction: 0.0125
  kT: 2.5e-05
  substep_dt: 0.01
  seed: 1
- op: active_force
  model: box_slab
  at: pt
  wall_stiffness: 400.0
  lo:
  - 0.6
  - 0.6
  - 0.6
  hi:
  - 19.8
  - 11.4
  - 5.8
- op: active_force
  model: persistent_walk
  at: pt
  cell_set: cell
  f: 0.0
  Dr: 4.0e-05
  seed: 1
  type_f:
    pear: 0.002
- op: pair_potential
  model: cell_contact
  at: pt
  cells: cell
  repulsion_strength: 600.0
  contact_slack: 0.2
  contact_surface_tension:
