general:
  name: mpm_sphere1000_zeta
  headline: spheres of red cells round one blue cell that grows and divides, sweep of bond damping (bond_damping)
  title: 'Nine spheres (3 x 3), each one blue inner cell at the centre of a closed one-cell-thick sphere of 20 red cells (1000 points per cell); only the blue cell grows (mass doubles every 80 frames = 80 min) and divides at twice its birth mass along its longest axis (division mass spread 0.3, daughter gap 0.3 units) and presses on the shell, which the junction trio holds together. SWEPT in this step, one value per sphere printed over its blue cell: bond_springs: bond damping (bond_damping), 0 to 30; the others at their defaults'
